  <main>
    <section class="py-5" style="background-color: #121416;">

        <h2 class="text-center mb-4">Pricing & Memberships</h2>
        <p class="text-center mb-5">Choose the plan that works best for you.</p>

        <img src="images/priceimage.png" class="img-fluid" alt="Pricing Image">
      </div>
    </section>
    <!-- select section start -->

    <style>
      .align-items-center {
        align-items: center;
        width: 50;
      }
    </style>
    <section class="mt-5">
    <div class="container-fluid  bg-primary text-dark" mb-4 mt-4  bg-primary text-dark>
       <select class=" form-select" aria-label="Default select example">
      <option selected>Please Select the Membership plan</option>
      <option value="1">1-Month-Plan</option>
      <option value="2">3-Month-Plan</option>
      <option value="3">6-Month-Plan</option>
      <option value="4">12-Month-Plan</option>
      </select>
    </div>
   
    </section>
    <!-- select section end -->
     <!-- new section start -->
    <section>
      <form class="row gx-3 gy-2 align-items-center bg-primary text-dark mb-3">
        <div class="col-sm-3">
          <label class="visually-hidden" for="specificSizeInputName">Name</label>
          <input type="text" class="form-control" id="specificSizeInputName" placeholder="Jane Doe">
        </div>
        <div class="col-sm-3">
          <label class="visually-hidden" for="specificSizeInputGroupUsername">Username</label>
          <div class="input-group">
            <div class="input-group-text">@</div>
            <input type="text" class="form-control" id="specificSizeInputGroupUsername" placeholder="Username">
          </div>
        </div>
        <div class="col-sm-3">
          <label class="visually-hidden" for="specificSizeSelect">Preference</label>
          <select class="form-select" id="specificSizeSelect">
            <option selected>Choose...</option>
            <option value="1">One</option>
            <option value="2">Two</option>
            <option value="3">Three</option>
          </select>
        </div>
        <div class="col-auto">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="autoSizingCheck2">
            <label class="form-check-label" for="autoSizingCheck2">
              Remember me
            </label>
          </div>
        </div>
        <div class="col-auto">
          <a href="index.html"><button type="submit" class="btn btn-primary">Submit</button>
          </a>
        </div>
      </form>
    </section>
